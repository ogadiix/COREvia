    <!-- Immediate Theme Initialization Script to Prevent FOUC (Flash of Unstyled Content / Initial Flash) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('corevia_theme_mode') || localStorage.getItem('corevia_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && systemDark) || (stored === 'system' && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          // Graceful fallback if localStorage is disabled in iframe/sandbox
        }
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F8] dark:bg-[#080F19] text-[#273444] dark:text-[#E8EEF5] antialiased selection:bg-[#168C83]/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
