name: COREvia CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: TypeScript Compile Check
      run: npm run lint

    - name: Security Audit
      run: npm audit --audit-level=high

    - name: Production Build
      run: npm run build
      env:
        NODE_ENV: production
