name: COREvia CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: corevia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Lint & Typecheck
      run: |
        npm run lint
        npm run typecheck

    - name: Database Migration & Test Seed
      run: |
        npm run db:migrate
        npm run seed
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/corevia
        SESSION_SECRET: test-session-secret-for-ci-minimum-32-chars-long

    - name: Platform Integration & Security Tests
      run: npm test
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/corevia
        SESSION_SECRET: test-session-secret-for-ci-minimum-32-chars-long

    - name: Security Audit
      run: npm audit --audit-level=high

    - name: Production Build
      run: npm run build
      env:
        NODE_ENV: production

