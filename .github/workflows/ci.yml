name: COREvia CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & UI Acceptance Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: corevia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Database Migration & Test Seed
        run: |
          npm run db:migrate
          npm run seed
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/corevia
          SESSION_SECRET: test-session-secret-for-ci-minimum-32-chars-long

      - name: Platform Integration & Security Tests (336 Assertions)
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/corevia
          SESSION_SECRET: test-session-secret-for-ci-minimum-32-chars-long

      - name: Production Client & Server Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Headless Acceptance & Accessibility Audit (91 Checks)
        run: npm run test:audit
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/corevia
          SESSION_SECRET: test-session-secret-for-ci-minimum-32-chars-long
          PORT: 3005
          APP_URL: http://localhost:3005
          CORS_ALLOWED_ORIGINS: http://localhost:3005,http://127.0.0.1:3005

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-verification:
    name: Docker Container & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.docker.example .env
          docker compose config

      - name: Build Multi-Stage Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: corevia-core-banking:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
